[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "CrossSim"
description = "Accuracy simulator for analog in-memory computing"
version = "3.2.1"
requires-python = ">=3.11"
license = {text = "BSD 3-Clause License"}
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages]
find = {}

# Local Windows / CUDA 12.8 study environment. Keep application dependencies
# separate from CrossSim's minimal library dependencies.
[dependency-groups]
lab = [
    "numpy==1.26.4",
    "scipy==1.11.4",
    "matplotlib==3.8.2",
    "pillow>=10,<12",
    "ipython>=8.8,<9",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "nbconvert>=7.16,<8",
    "torch==2.7.1+cu128",
    "torchvision==0.22.1+cu128",
    "tensorflow==2.17.1",
    "tensorflow-intel==2.17.1; sys_platform == 'win32'",
    "keras==3.6.0",
    "cupy-cuda12x==13.6.0",
    "opencv-python==4.10.0.84",
    "scikit-learn>=1.5,<1.8",
    "pandas>=2.2,<3",
    "tqdm>=4.66,<5",
]

[tool.uv]
default-groups = ["lab"]
environments = ["sys_platform == 'win32' and python_version == '3.11'"]
link-mode = "copy"
# The upstream `gpu` extra installs CuPy from source; this environment uses
# the CUDA 12 binary wheel instead. Do not install both CuPy distributions.
conflicts = [[{ extra = "gpu" }, { group = "lab" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.optional-dependencies]
gpu = ["cupy"]
dnn-examples = ["tensorflow", "matplotlib"]
dev = [
    "pytest", 
    "pytest-cov", 
    "pytest-randomly", 
    "pytest-xdist", 
    "pytest-profiling", 
    "hypothesis", 
    "ruff>=0.4.3", 
    "matplotlib",
    "mypy", 
    "sphinx", 
    "sphinx-rtd-theme",
    "sphinx_design",
    "sphinxcontrib-bibtex",
    "sphinx-autobuild>=2025.8.25",
    "myst-parser",
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = ["--cov=simulator", "--cov-report=term"]

[tool.coverage.run]
# omit = [
#     "path/to/omitted"
# ]
branch = true

[tool.ruff]
preview = true
target-version = "py310"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    # Quarantined directories not to check
    "tutorial",
    "applications/dsp/**",
    "applications/matlab/**",
    "applications/mvm_params.py",
    "applications/dnn/inference/**",
    "applications/dnn/keras/**",
    "applications/dnn/calibration.py",
    "applications/dnn/dataset_loaders.py",
    "applications/dnn/dnn_inference_params.py",
    "tests/behavioral_tests",
    "simulator/algorithms/dnn/dnn*",
    "simulator/algorithms/dnn/activate.py",
    "simulator/algorithms/dnn/convolution.py*",
]

[tool.ruff.lint]
# See different rule sets at:
# https://docs.astral.sh/ruff/rules/
select = ["E", "F", "B", "C", "W", "D", "S", "BLE", "A", "COM", "CPY", "Q", "RSE", "TID", "PTH", "ERA"]

# COM812 conflicts with `ruff format` and is recommended to be ignored
ignore = ["D210", "D205", "D100", "S311", "COM812"] 

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["B", "F401", "ERA001"]

extend-select = ["CPY"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-copyright]
notice-rgx = """
#
# Copyright 2017-2026 National Technology & Engineering Solutions of Sandia, LLC 
# (NTESS). Under the terms of Contract DE-NA0003525 with NTESS, the U.S. 
# Government retains certain rights in this software.
#
# See LICENSE for full license details
#
"""

# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "D104"]
"api.py" = ["F401"]

# Applications folders have commented out code for examples
"applications/**" = ["ERA001"]

# The following are under "quarantine" until we decide to tackle these
"tutorial/**" = ["ALL"]
"tests/utils/**" = ["ALL"]
"tests/**" = ["S101", "D103", "ALL"]
"docs/**" = ["ALL"]


# Models defined usually implement mathematic models defined by a paper,
# which are often single letter variable names. We add this exception as
# the variables are following a mathematical convention.
"simulator/devices/custom/*.py" = ["E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
# Rational: 
# PEP8 requests 80/72 code/docstring widths (https://peps.python.org/pep-0008/)
# Black suggests 88
# -> Adjust doctring widths to 80
max-doc-length = 80

[[tool.mypy.overrides]]
# https://mypy.readthedocs.io/en/stable/config_file.html#the-mypy-configuration-file
module = [
    "cupy",
    "numpy",
    "scipy.*"
]
ignore_missing_imports = true

